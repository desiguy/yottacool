<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Verifier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>URL Verifier</h1>
    <form id="urlForm">
        <label for="url1">URL 1:</label>
        <input type="url" id="url1" name="url1"><br><br>

        <label for="url2">URL 2:</label>
        <input type="url" id="url2" name="url2"><br><br>

        <label for="url3">URL 3:</label>
        <input type="url" id="url3" name="url3"><br><br>

        <label for="url4">URL 4:</label>
        <input type="url" id="url4" name="url4"><br><br>

        <label for="url5">URL 5:</label>
        <input type="url" id="url5" name="url5"><br><br>

        <button type="button" onclick="verifyURLs()">Verify URLs</button>
    </form>

    <h2>Results:</h2>
    <div id="results">
        <!-- Results will be displayed here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
