<!DOCTYPE html>
<html>
<head>
  <title>Random Number Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Random Number Generator</h1>
  <form id="randomizerForm">
    <div>
      <label for="numSets">How many sets of numbers do you want to generate?</label>
      <input type="number" id="numSets" value="1">
    </div>
    <div>
      <label for="numPerSet">How many numbers per set?</label>
      <input type="number" id="numPerSet" value="50">
    </div>
    <div>
      <label>Number range (e.g., 1-50)</label>
      <input type="number" id="minRange" value="1">
      -
      <input type="number" id="maxRange" value="643">
    </div>
    <div>
      <label for="uniqueNumbers">Do you wish each number in a set to remain unique?</label>
      <input type="checkbox" id="uniqueNumbers" checked>
    </div>
    <div>
      <label for="sortNumbers">Do you wish to sort the numbers that are generated?</label>
      <input type="checkbox" id="sortNumbers" checked>
    </div>
    <button type="button" id="generateButton">Generate Numbers</button>
  </form>
  <div id="resultsArea"></div>
  <script src="script.js" defer></script>
</body>
</html>
